<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#0b0a14" />
    <script defer src="https://use.fontawesome.com/releases/v5.8.1/js/solid.js" integrity="sha384-IA6YnujJIO+z1m4NKyAGvZ9Wmxrd4Px8WFqhFcgRmwLaJaiwijYgApVpo1MV8p77" crossorigin="anonymous"></script>
    <script defer src="https://use.fontawesome.com/releases/v5.8.1/js/regular.js" integrity="sha384-Uc9toywOA44owltk1MWl0lQZ+L0mBzJkLQcdif6+JtG9izvok9DLJtCZX57Uq3k2" crossorigin="anonymous"></script>
    <script defer src="https://use.fontawesome.com/releases/v5.8.1/js/fontawesome.js" integrity="sha384-EMmnH+Njn8umuoSMZ3Ae3bC9hDknHKOWL2e9WJD/cN6XLeAN7tr5ZQ0Hx5HDHtkS" crossorigin="anonymous"></script>
    <link rel="manifest" href="/manifest.json" />
    <title>Daily Tarot</title>
    <meta name="description" content="Draw your tarot card of the day for guidance, reflection and intention, and keep a diary of your readings." />

    <!-- Social preview (link cards on Facebook, iMessage, Slack, X etc.). Crawlers don't run JS, so these
         need full URLs; VITE_SITE_URL comes from .env.production / .env.development. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Daily Tarot" />
    <meta property="og:title" content="Daily Tarot ~ Your Card of the Day" />
    <meta property="og:description" content="Draw your tarot card of the day for guidance, reflection and intention, and keep a diary of your readings." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/social-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Daily Tarot: Your Card of the Day. Guidance, reflection, intention." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Daily Tarot ~ Your Card of the Day" />
    <meta name="twitter:description" content="Draw your tarot card of the day for guidance, reflection and intention, and keep a diary of your readings." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/social-preview.jpg" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
